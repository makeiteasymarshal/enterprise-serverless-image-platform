name: Manual AWS identity verification
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type VERIFY to check the configured OIDC role. This does not deploy resources.
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  identity:
    if: inputs.confirm == 'VERIFY'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1
      - name: Verify temporary AWS identity
        run: aws sts get-caller-identity
